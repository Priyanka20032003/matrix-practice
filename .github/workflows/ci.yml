
name: Python Matrix CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install quality tools
        run: python -m pip install black isort ruff flake8 bandit pip-audit pytest pytest-cov

      - name: Upgrade setuptools
        run: python -m pip install --upgrade "setuptools>=84.1.0"

      - name: Upgrade vulnerable dependency
        run: python -m pip install --upgrade "filelock>=4.2.1"

      - name: Dependency security scan
        run: python -m pip_audit

      - name: Black check
        run: python -m black --check .

      - name: isort check
        run: python -m isort --check-only .

      - name: Ruff check
        run: python -m ruff check .

      - name: Flake8 check
        run: python -m flake8 .

      - name: Bandit security scan
        run: python -m bandit -r . --exclude ./test_app.py

      - name: Dependency security scan
        run: python -m pip_audit

      - name: Run tests with coverage
        run: python -m pytest --cov=app --cov-report=term-missing

      - name: Build Docker image
        run: docker build -t matrix-practice:latest .

  sonarqube:
    name: SonarQube Cloud Analysis
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Cloud Analysis
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
